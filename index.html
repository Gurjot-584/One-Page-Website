<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Page Website</title>

  <style>
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .gallery-img {
      width: 25%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1><center>My One Page Website Gallery</center></h1><center>

    <div class="gallery">

    <img src="plant1-small.png"
         data-large="plant1.png"
         class="gallery-img"
         alt="Image 1">

    <img src="plant2-small.png"
         data-large="plant2.png"
         class="gallery-img"
         alt="Image 2">

    <img src="plant3-small.png"
         data-large="plant3.png"
         class="gallery-img"
         alt="Image 3">

    <img src="plant4-small.png"
         data-large="plant4.png"
         class="gallery-img"
         alt="Image 4">

  </div></center>

    <div id="lightbox" class="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" class="lightbox-content" alt="Expanded View">
  </div>

  <!-- LINK TO JS FILE -->
  <script src="JS/one_page_website.js"></script>

</body>
</html>
